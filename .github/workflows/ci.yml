name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate ${{ matrix.product }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        product: [twitch, youtube]

    defaults:
      run:
        working-directory: apps/${{ matrix.product }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check src\background.js
          node --check src\content.js
          node --check popup\popup.js
          node --check options\options.js

      - name: Run extension smoke tests
        shell: pwsh
        run: node scripts\smoke-test.mjs

      - name: Run native host unit tests
        shell: pwsh
        run: python -m unittest discover -s native-host\tests -p "test*.py"

      - name: Package extension runtime
        shell: pwsh
        run: .\scripts\package.ps1

      - name: Package release dry run
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version "0.1.0"

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}-extension
          path: |
            apps/${{ matrix.product }}/dist/${{ matrix.product }}-local-exporter.zip
            apps/${{ matrix.product }}/dist/unpacked/${{ matrix.product }}-local-exporter/**

      - name: Upload release dry-run assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}-release-dry-run
          path: |
            apps/${{ matrix.product }}/dist/release/${{ matrix.product }}-local-exporter-v0.1.0-windows.zip
            apps/${{ matrix.product }}/dist/release/${{ matrix.product }}-local-exporter-extension-v0.1.0.zip
            apps/${{ matrix.product }}/dist/release/SHA256SUMS.txt
            apps/${{ matrix.product }}/dist/release/release-manifest.json
