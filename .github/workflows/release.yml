name: Product Release

on:
  push:
    tags:
      - "twitch-v*.*.*"
      - "youtube-v*.*.*"
  workflow_dispatch:
    inputs:
      product:
        description: "Product to release"
        required: true
        type: choice
        options: [twitch, youtube]
      version:
        description: "Release version, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve product and version
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.release.outputs.product }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            product="${{ inputs.product }}"
            version="${{ inputs.version }}"
            version="${version#v}"
            tag="$product-v$version"
          else
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" =~ ^(twitch|youtube)-v(.+)$ ]]; then
              product="${BASH_REMATCH[1]}"
              version="${BASH_REMATCH[2]}"
            else
              echo "Release tag must be twitch-vX.Y.Z or youtube-vX.Y.Z" >&2
              exit 1
            fi
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ needs.resolve.outputs.product }} (${{ matrix.platform }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos-x64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/${{ needs.resolve.outputs.product }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate extension and native host
        shell: bash
        run: |
          node --check src/background.js
          node --check src/content.js
          node --check popup/popup.js
          node --check options/options.js
          node scripts/smoke-test.mjs
          python -m unittest discover -s native-host/tests -p 'test*.py'

      - name: Build Windows native host
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\build-native.ps1

      - name: Build macOS native host
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: bash ./scripts/build-native.sh

      - name: Package Windows release
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version "${{ needs.resolve.outputs.version }}"

      - name: Package macOS release
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: bash ./scripts/package-release.sh --version "${{ needs.resolve.outputs.version }}"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.product }}-${{ matrix.platform }}-release
          path: |
            apps/${{ needs.resolve.outputs.product }}/dist/release/*.zip
            apps/${{ needs.resolve.outputs.product }}/dist/release/*.exe
            apps/${{ needs.resolve.outputs.product }}/dist/release/*macos-*
            apps/${{ needs.resolve.outputs.product }}/dist/release/SHA256SUMS*.txt
            apps/${{ needs.resolve.outputs.product }}/dist/release/release-manifest*.json
            apps/${{ needs.resolve.outputs.product }}/dist/release/RELEASE_NOTES*.md

  publish:
    name: Publish ${{ needs.resolve.outputs.product }} release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform release assets
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.resolve.outputs.product }}-*-release
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.exe' -o -name 'SHA256SUMS*.txt' -o -name 'release-manifest*.json' \) -print | sort)
          notes="$(find release-assets -type f -name 'RELEASE_NOTES.md' -print -quit)"
          [[ -n "$notes" ]] || notes="$(find release-assets -type f -name 'RELEASE_NOTES*.md' -print -quit)"
          [[ "${#assets[@]}" -gt 0 ]] || { echo "No release assets were downloaded." >&2; exit 1; }
          gh release create "${{ needs.resolve.outputs.tag }}" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ needs.resolve.outputs.product }} Local Exporter ${{ needs.resolve.outputs.tag }}" \
            --notes-file "$notes" \
            --latest
