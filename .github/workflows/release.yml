name: Product Release

on:
  push:
    tags:
      - "twitch-v*.*.*"
      - "youtube-v*.*.*"
  workflow_dispatch:
    inputs:
      product:
        description: "Product to release"
        required: true
        type: choice
        options: [twitch, youtube]
      version:
        description: "Release version, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release product
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve product and version
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $product = "${{ inputs.product }}"
            $version = "${{ inputs.version }}".Trim()
            $tag = "$product-v$($version.TrimStart('v'))"
          } else {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -notmatch '^(twitch|youtube)-v(.+)$') { throw "Release tag must be twitch-vX.Y.Z or youtube-vX.Y.Z" }
            $product = $Matches[1]
            $version = $Matches[2]
          }
          if (-not ($version -match '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$')) { throw "Invalid version: $version" }
          "product=$product" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Validate product
        shell: pwsh
        working-directory: apps/${{ steps.release.outputs.product }}
        run: |
          node --check src\background.js
          node --check src\content.js
          node --check popup\popup.js
          node --check options\options.js
          node scripts\smoke-test.mjs
          python -m unittest discover -s native-host\tests -p "test*.py"

      - name: Install native build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip uv
          uv --version

      - name: Build native host executable
        shell: pwsh
        working-directory: apps/${{ steps.release.outputs.product }}
        run: .\scripts\build-native.ps1

      - name: Package release assets
        shell: pwsh
        working-directory: apps/${{ steps.release.outputs.product }}
        run: .\scripts\package-release.ps1 -Version "${{ steps.release.outputs.version }}"

      - name: Publish GitHub release
        shell: pwsh
        working-directory: apps/${{ steps.release.outputs.product }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $product = "${{ steps.release.outputs.product }}"
          $title = "$product Local Exporter $tag"
          $notes = "dist\release\RELEASE_NOTES.md"
          $assetPaths = @(
            "dist\release\$product-local-exporter-v${{ steps.release.outputs.version }}-windows.zip",
            "dist\release\$product-local-exporter-extension-v${{ steps.release.outputs.version }}.zip",
            "dist\release\$product-local-exporter-host-v${{ steps.release.outputs.version }}-windows-x64.exe",
            "dist\release\SHA256SUMS.txt",
            "dist\release\release-manifest.json"
          ) | Where-Object { Test-Path $_ }
          gh release create $tag @assetPaths --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes-file $notes --latest
